  <meta charset="UTF-8">

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // REQ-061: Meta Embedded Signup for "Connect WhatsApp". The Facebook SDK loads only
    // when the owner clicks Connect. Resolves {code, waba_id, phone_number_id} or null.
    window.startWhatsAppSignup = function (appId, configId) {
      return new Promise(function (resolve) {
        var session = {};
        function onMessage(event) {
          if (event.origin !== 'https://www.facebook.com' && event.origin !== 'https://web.facebook.com') return;
          try {
            var data = JSON.parse(event.data);
            if (data.type === 'WA_EMBEDDED_SIGNUP' && data.event === 'FINISH') session = data.data || {};
          } catch (e) { /* not ours */ }
        }
        window.addEventListener('message', onMessage);
        function login() {
          FB.init({ appId: appId, autoLogAppEvents: true, xfbml: false, version: 'v21.0' });
          FB.login(function (response) {
            window.removeEventListener('message', onMessage);
            var code = response && response.authResponse && response.authResponse.code;
            if (!code || !session.waba_id || !session.phone_number_id) { resolve(null); return; }
            resolve({ code: code, waba_id: session.waba_id, phone_number_id: session.phone_number_id });
          }, {
            config_id: configId, response_type: 'code', override_default_response_type: true,
            extras: { setup: {}, sessionInfoVersion: '3' }
          });
        }
        if (window.FB) { login(); return; }
        var s = document.createElement('script');
        s.src = 'https://connect.facebook.net/en_US/sdk.js';
        s.async = true; s.crossOrigin = 'anonymous';
        s.onload = login;
        s.onerror = function () { window.removeEventListener('message', onMessage); resolve(null); };
        document.body.appendChild(s);
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
